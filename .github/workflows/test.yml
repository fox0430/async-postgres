name: Unit tests

on:
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'docker-compose.yml'
      - 'async_postgres.nim*'
      - 'async_postgres/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'docker-compose.yml'
      - 'async_postgres.nim*'
      - 'async_postgres/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # macOS and Windows are compile-heavy and slower than Linux, which
    # finishes in about 15 minutes.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || 60 }}
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
          - 'macOS-latest'
          - 'windows-latest'
        nim-version:
          - '2.2.4'
          - 'stable'
          - 'devel'
        exclude:
          # setup-nim-action cannot install the devel compiler on Windows.
          # macOS devel is too slow.
          - os: 'windows-latest'
            nim-version: 'devel'
          - os: 'macOS-latest'
            nim-version: 'devel'

    name: Tests on ${{ matrix.nim-version }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v6

      - name: Cache nimble
        id: cache-nimble
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-v2-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-v2-

      - name: Setup Nim (stable/release)
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.nim-version != 'devel'

      - name: Setup Nim (devel)
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          use-nightlies: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.nim-version == 'devel'

      - name: Check public API surface
        run: nimble apiSurface -y

      - name: Generate test certificates
        if: runner.os == 'Linux'
        run: bash tests/gen_certs.sh

      # macOS and Windows runners cannot run the Linux PostgreSQL container.
      - name: Start PostgreSQL
        id: start-psql
        if: runner.os == 'Linux'
        run: docker compose up -d --wait
        background: true

      - name: Install chronos
        id: install-chronos
        run: nimble install chronos -y
        background: true

      - name: Wait setup
        wait: [start-psql, install-chronos]

      - name: Install async_postgres
        shell: bash
        run: |
          rm -rf ~/.nimble/pkgs2/async_postgres-*
          nimble install -y

      - name: Run tests
        id: run-tests
        if: runner.os == 'Linux'
        run: nimble test -y
        background: true

      # No PostgreSQL on macOS/Windows: unit and mock-server tests only.
      - name: Run unit tests
        id: run-unit-tests
        if: runner.os != 'Linux'
        run: nimble testUnit -y
        background: true

      # tests/config.nims always adds -d:ssl, so no test build covers this.
      - name: Check build without TLS (asyncdispatch, no -d:ssl)
        run: nim check --hints:off --warningAsError:UnreachableCode --warningAsError:UnusedImport async_postgres.nim

      - name: Compile examples (asyncdispatch)
        shell: bash
        run: for f in examples/*.nim; do nim c "$f"; done

      - name: Compile examples (chronos)
        shell: bash
        run: for f in examples/*.nim; do nim c -d:asyncBackend=chronos "$f"; done

      # Platform-independent, so generate once.
      - name: Gen docs
        if: runner.os == 'Linux'
        run: |
          nim doc --project --index:on --outdir:./htmldocs ./async_postgres.nim

      - name: Wait tests
        wait: [run-tests, run-unit-tests]
